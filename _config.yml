# ==============================================================================
#  Site settings
#  This file is NOT reloaded by `jekyll serve` — restart the server after edits.
# ==============================================================================

title                    : "Mathematical AI for Decision and Discovery"
tagline                  : "Henry Moss, Lancaster University"
institution              : "LANCASTER UNIVERSITY"
description              : >-
  Mathematical AI for Decision and Discovery — Henry Moss's group at Lancaster University.
  Probabilistic machine learning, Gaussian processes, Bayesian optimisation and
  experimental design for scientific discovery and real-world engineering.
locale                   : "en-GB"
url                      : "https://henrymoss.github.io"
baseurl                  : ""
repository               : "henrymoss/henrymoss.github.io"
timezone                 : Europe/London

author:
  name                   : "Henry Moss"
  role                   : "Reader in Mathematics and AI"
  department             : "School of Mathematical Sciences"
  university             : "Lancaster University"
  # Stored encoded so the plain address is in neither the served HTML nor this
  # public repo. Regenerate with:
  #   python3 -c "import base64;print(base64.b64encode(b'you@example.com').decode())"
  email_b64              : "aGVucnkubW9zc0BsYW5jYXN0ZXIuYWMudWs="
  email_hint             : "henry.moss [at] lancaster.ac.uk"   # no-JS fallback
  googlescholar          : "https://scholar.google.com/citations?user=m00SvLMAAAAJ&hl=en"
  lancaster              : "https://www.lancaster.ac.uk/maths/people/henry-moss2"

# ------------------------------------------------------------------------------
#  Build
# ------------------------------------------------------------------------------

markdown                 : kramdown
highlighter              : rouge
kramdown:
  input                  : GFM
  auto_ids               : true
  hard_wrap              : false
  smart_quotes           : lsquo,rsquo,ldquo,rdquo

include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .sass-cache
  - .jekyll-cache
keep_files:
  - .git

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# ------------------------------------------------------------------------------
#  Collections
# ------------------------------------------------------------------------------

# All content lives in _data/*.yml — one file each, easier to edit than a
# directory of stubs.

defaults:
  - scope:
      path               : ""
      type               : pages
    values:
      layout             : page
