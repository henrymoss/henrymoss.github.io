<header class="header">
   <div class="brand">
      <a class="name" href="{{ '/#top' | relative_url }}">
         <img class="logo" src="{{ '/images/logo-header.svg' | relative_url }}" alt="" width="196" height="52">
         <span class="wordmark">{{ site.title }}</span>
      </a>
   </div>
   <nav class="navigation" aria-label="Main">
      {%- for item in site.data.navigation.main %}
      <a href="{% if item.url contains '://' %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"{% if item.url contains '://' %} rel="noopener"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
   </nav>
</header>
<div class="headerSpacer"></div>
