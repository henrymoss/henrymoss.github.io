# ==============================================================================
#  Publications, newest first. Single source for the list on the home page.
#
#  Fields
#    title      required
#    authors    required — surnames, in paper order
#    venue      required — shown in red under the authors
#    year       required — used for the year groupings
#    thumbnail  Figure 1 from the paper (/images/figures/), or a drawn stand-in
#               (/images/thumbs/) where a figure could not be extracted cleanly
#    pdf        local PDF under /files/
#    arxiv      arXiv abstract page
#    link       publisher page
#    code       repository — shown as a "Code" link under the paper
#    honour     optional — "Spotlight", "Oral", … shown on its own starred row
#    award      optional — a prize, shown on its own starred row
#    under_review  optional — set `under_review: true` and the paper is lifted
#               out of its year and shown in the "Under review" block at the
#               top of the list instead. `year` is then unused, but harmless
#               to leave in place for when the paper is accepted.
#
#  The home page groups everything else by `year` on its own, so the year
#  banner comments below are only a navigation aid while editing this file.
#
# ==============================================================================









