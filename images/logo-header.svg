<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 52" width="196" height="52" role="img">
<style>

  .hop, .peg, .ring, .star { transform-box: fill-box; transform-origin: center; }

  /* One shot: the search plays out as the page loads, then the mark sits
     still. A header is on screen the whole time, so nothing loops here. */
  .hop { animation: maddFade .4s ease both; }
  .h0 { animation-delay: .06s } .h1 { animation-delay: .20s }
  .h2 { animation-delay: .34s } .h3 { animation-delay: .48s }

  .peg { animation: maddPop .4s cubic-bezier(.34,1.56,.64,1) both; }
  .p0 { animation-delay: .13s } .p1 { animation-delay: .27s }
  .p2 { animation-delay: .41s } .p3 { animation-delay: .55s }

  .ring { animation: maddRipple .5s ease-out both; }
  .r0 { animation-delay: .68s } .r1 { animation-delay: .77s }
  .r2 { animation-delay: .86s }

  .star { animation: maddPop .45s cubic-bezier(.34,1.56,.64,1) .96s both; }

  @keyframes maddFade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes maddPop {
     0%   { opacity: 0; transform: scale(.2) }
     100% { opacity: 1; transform: scale(1) }
  }
  @keyframes maddRipple {
     0%   { opacity: 0; transform: scale(.45) }
     60%  { opacity: 1 }
     100% { opacity: 1; transform: scale(1) }
  }

  /* hold everything still for anyone who has asked for less movement */
  @media (prefers-reduced-motion: reduce) {
     .hop, .peg, .ring, .star {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
     }
  }

</style>
<path class="hop h0" d="M 11,41 Q 28,11 45,37" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<path class="hop h1" d="M 45,37 Q 62,7 79,33" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<path class="hop h2" d="M 79,33 Q 96,3 113,29" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<path class="hop h3" d="M 113,29 Q 128,1 143,27" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="0.1 5.5" stroke-linecap="round"/>
<circle class="peg p0" cx="11" cy="41" r="5" fill="#2d1e69" stroke="#ffffff" stroke-width="2.4"/>
<circle class="peg p1" cx="45" cy="37" r="5" fill="#2d1e69" stroke="#ffffff" stroke-width="2.4"/>
<circle class="peg p2" cx="79" cy="33" r="5" fill="#2d1e69" stroke="#ffffff" stroke-width="2.4"/>
<circle class="peg p3" cx="113" cy="29" r="5" fill="#2d1e69" stroke="#ffffff" stroke-width="2.4"/>
<circle class="ring r0" cx="166" cy="25" r="19" fill="none" stroke="#6052ab" stroke-width="1.9"/>
<circle class="ring r1" cx="166" cy="25" r="13.93" fill="none" stroke="#de6fa1" stroke-width="2.28"/>
<circle class="ring r2" cx="166" cy="25" r="9.18" fill="none" stroke="#f97b3d" stroke-width="2.28"/>
<g class="star"><path d="M 166,17.72 C 167.6,23.4 167.6,23.4 173.28,25 C 167.6,26.6 167.6,26.6 166,32.28 C 164.4,26.6 164.4,26.6 158.72,25 C 164.4,23.4 164.4,23.4 166,17.72 Z" fill="#ffd23f" transform="rotate(45 166 25)"/><path d="M 166,19.62 C 167.18,23.82 167.18,23.82 171.38,25 C 167.18,26.18 167.18,26.18 166,30.38 C 164.82,26.18 164.82,26.18 160.62,25 C 164.82,23.82 164.82,23.82 166,19.62 Z" fill="#ffffff" stroke="#2d1e69" stroke-width="0.95" stroke-linejoin="round"/></g>
</svg>
